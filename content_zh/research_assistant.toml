[[items.projects]]
id = "gsa-yolo"
title = "GSA-YOLO"
content = "面向遮挡与复杂背景下的实时 X-ray 安检，提出轻量化 GSA-YOLO，融合 Group Lasso 结构化软稀疏、Sparse Structure Selection 硬剪枝与 Adaptive Knowledge Distillation 自适应蒸馏，实现模型压缩后的精度恢复与推理加速。在 HiXray / PIDray 上，mAP50:95 较基线提升 **2.4% / 1.8%**，推理速度提升 **11.2%**。"
content_variants = ["提出面向实时 X-ray 安检的 GSA-YOLO，结合 Group Lasso、SSS 剪枝与自适应蒸馏，实现模型压缩、精度恢复和推理加速；HiXray / PIDray 的 mAP50:95 提升 **2.4% / 1.8%**，推理速度提升 **11.2%**。", "提出融合 Group Lasso、SSS 剪枝与自适应蒸馏的 GSA-YOLO，实现轻量化安检；HiXray / PIDray 精度提升 **2.4% / 1.8%**，推理提速 **11.2%**。"]
compact_content = "提出融合 Group Lasso、SSS 与自适应蒸馏的 GSA-YOLO；HiXray / PIDray 精度提升 **2.4% / 1.8%**，推理提速 **11.2%**。"
tags = ["YOLOv8", "Group Lasso", "Structured Pruning (SSS)", "Adaptive Knowledge Distillation", "TensorRT FP16 Deployment"]
