[[items.projects]]
id = "layerrecall"
title = "LayerRecall"
content = "面向有限 KV Cache 下的长视频一致性退化，参与提出 State-Conditioned Memory Router，按当前状态检索历史 K/V 并注入记忆敏感层；负责 Attention Profiling、敏感层定位与路由分析，参与 CHPM 设计和跨 LongLive / Self-Forcing 骨干验证。在 **100** 个 multi-shot prompts 上，MemoBench / MovieBench Overall 达 **0.548 / 0.579**，VBench-Long 达 **0.978**。"
content_variants = ["参与状态条件记忆路由与 CHPM 设计，按当前状态检索历史 K/V 并注入敏感层；负责 Attention Profiling 与路由分析，开展跨 LongLive / Self-Forcing 验证。**100** 个 multi-shot prompts 上，MemoBench / MovieBench 为 **0.548 / 0.579**，VBench-Long 为 **0.978**。", "参与长视频记忆路由与 CHPM，负责注意力及敏感层分析，并开展跨骨干验证；MemoBench / MovieBench 为 **0.548 / 0.579**，VBench-Long 为 **0.978**。"]
compact_content = "参与记忆路由与 CHPM，负责注意力分析；MemoBench / MovieBench 达 **0.548 / 0.579**，VBench-Long 达 **0.978**。"
tags = ["Autoregressive Video Generation", "KV Cache", "Attention Profiling", "Conditioned Memory Routing", "CHPM"]
resources = [{ kind = "pdf", href = "https://arxiv.org/pdf/2608.28460" }, { kind = "code", href = "https://github.com/Yixuan-Ding-ZJU/LayerRecall" }, { kind = "projectPage", href = "https://yixuan-ding-zju.github.io/LayerRecall_Web/" }, { kind = "demo", href = "https://huggingface.co/spaces/Yixuan-Ding-ZJU/layerrecall-long-video" }, { kind = "details", href = "/publications#layerrecall" }]

