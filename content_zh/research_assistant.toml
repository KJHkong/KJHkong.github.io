[[items.projects]]
id = "catbox"
title = "CatBOX"
content = "面向有限预算的混合变量催化优化，参与设计 CatBOX，主导 Cauchy–Gaussian Spectral Mixture Kernel（CSM+GSM）推导与实现，结合类别核及信赖域交替优化，同时建模平滑与非平滑响应。在合成基准上，较最优基线平均取得 **3 倍以上**改进，较随机搜索提升约 **19 倍**，并在 OCM / SCR / DAr 的 in-silico 评测中识别高性能配方与反应条件。"
content_variants = ["参与混合变量贝叶斯优化框架 CatBOX，主导 CSM+GSM 谱混合核推导与实现，结合类别核及信赖域优化建模平滑和非平滑响应；较最优基线平均改进 **3 倍以上**，较随机搜索提升约 **19 倍**，并开展 OCM / SCR / DAr 催化反应评测。", "主导 CSM+GSM 谱混合核推导与实现，参与混合变量贝叶斯优化及催化反应评测；较最优基线平均改进 **3 倍以上**，较随机搜索提升约 **19 倍**。"]
compact_content = "主导 CSM+GSM 核推导与实现，参与混合变量贝叶斯优化；较最优基线改进 **3 倍以上**，较随机搜索提升约 **19 倍**。"
tags = ["Bayesian Optimization", "Gaussian Process", "Spectral Mixture Kernel", "Hamming Kernel", "AutoGluon"]
resources = [{ kind = "pdf", href = "https://arxiv.org/pdf/2505.17393.pdf" }, { kind = "code", href = "https://github.com/Lab-of-Catalysis-AI/CatBOX" }]

