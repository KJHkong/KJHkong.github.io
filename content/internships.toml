[[items.projects]]
id = "citevqa"
title = "CiteVQA"
content = "Built cross-document semantic retrieval, evidence extraction and template-distilled QA with answerability, closed-book and BBox-masking checks. Teacher tool trajectories and BBox IoU rejection sampling yielded **3K** SFT samples matching **5K** labeled samples on FinRAGBench-V / ViDoRe V3. Built a **711-PDF / 1,897-QA** benchmark; SAA and fine-grained LLM-as-Judge evaluation of **20** MLLMs exposed evidence-attribution hallucinations."
content_variants = ["Built cross-document QA and evidence-quality pipelines. Trajectory distillation and BBox IoU rejection sampling yielded **3K** synthetic samples matching **5K** labeled samples on FinRAGBench-V / ViDoRe V3. Built a **711-PDF / 1,897-QA** benchmark; SAA evaluation of **20** MLLMs exposed evidence-attribution hallucinations.", "Built cross-document QA and evidence-quality pipelines with tool-trajectory distillation and BBox IoU sampling. **3K** synthetic samples matched **5K** labeled samples; a **711-PDF / 1,897-QA** benchmark audited **20** MLLMs with SAA."]
compact_content = "Built QA pipelines and a **711-PDF / 1,897-QA** benchmark; SAA evaluation of **20** MLLMs exposed citation errors."
