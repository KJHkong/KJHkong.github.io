id = "mineru"
title = "MinerU2.5-Pro"
content = "Supported DDAS diversity/difficulty sampling, CMCV consistency checks and Judge-and-Refine curation for **3.9M Hard-sample SFT / 192K GRPO** samples. Ran MinerU-SWIFT SFT→GRPO experiments and Rollout analysis, using MGAM for layout-granularity mismatches and IoU / Edit Distance / CDM / TEDS for multi-task reward design. OmniDocBench v1.6 Full: **95.69**, **+2.71** over the same-architecture baseline."
