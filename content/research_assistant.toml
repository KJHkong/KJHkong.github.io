[[items.projects]]
id = "catbox"
title = "CatBOX"
content = "Co-designed CatBOX for budget-limited mixed-variable catalysis optimization. Led derivation and implementation of a Cauchy–Gaussian Spectral Mixture Kernel (CSM+GSM), coupled with categorical kernels and trust-region alternating optimization. Synthetic benchmarks showed **>3×** improvement over the best baseline and ~**19×** over random search, with in-silico validation on OCM / SCR / DAr."
content_variants = ["Led CSM+GSM spectral-kernel development for CatBOX mixed-variable Bayesian optimization, with categorical kernels and trust regions. Synthetic results improved **>3×** over the best baseline and ~**19×** over random search; evaluated OCM / SCR / DAr.", "Led CSM+GSM kernel derivation and implementation for CatBOX mixed-variable optimization, with **>3×** improvement over the best baseline and ~**19×** over random search."]
compact_content = "Led CSM+GSM kernel development for CatBOX: **>3×** over the best baseline and ~**19×** over random search."
tags = ["Bayesian Optimization", "Gaussian Process", "Spectral Mixture Kernel", "Hamming Kernel", "AutoGluon"]
resources = [{ kind = "pdf", href = "https://arxiv.org/pdf/2505.17393.pdf" }, { kind = "code", href = "https://github.com/Lab-of-Catalysis-AI/CatBOX" }]

