[[items.projects]]
id = "gsa-yolo"
title = "GSA-YOLO"
content = "Proposed lightweight GSA-YOLO for occluded, cluttered real-time X-ray inspection. Combined Group Lasso soft sparsity, Sparse Structure Selection hard pruning and adaptive knowledge distillation to recover accuracy after compression. mAP50:95 improved by **2.4% / 1.8%** on HiXray / PIDray, with **11.2%** faster inference over the baseline."
content_variants = ["Proposed GSA-YOLO with Group Lasso soft sparsity, SSS hard pruning and adaptive distillation for real-time X-ray inspection. HiXray / PIDray mAP50:95 improved by **2.4% / 1.8%**, with **11.2%** faster inference.", "Built lightweight GSA-YOLO with Group Lasso, SSS pruning and adaptive distillation. HiXray / PIDray mAP50:95: **+2.4% / +1.8%**; inference: **11.2%** faster."]
