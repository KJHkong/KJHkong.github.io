[[items.projects]]
id = "layerrecall"
title = "LayerRecall"
content = "Co-developed a State-Conditioned Memory Router for bounded-KV long-video generation, retrieving historical K/V into memory-sensitive layers. Conducted attention profiling, layer localization and routing analysis; contributed to CHPM and LongLive / Self-Forcing validation. On **100** multi-shot prompts, MemoBench / MovieBench Overall reached **0.548 / 0.579**, with **0.978** on VBench-Long."
content_variants = ["Co-developed state-conditioned memory routing and CHPM for long-video generation; conducted attention and sensitive-layer analysis with LongLive / Self-Forcing validation. MemoBench / MovieBench: **0.548 / 0.579**; VBench-Long: **0.978**.", "Developed memory routing and CHPM with attention profiling and cross-backbone evaluation. MemoBench / MovieBench: **0.548 / 0.579**; VBench-Long: **0.978**."]
compact_content = "Developed memory routing and CHPM; MemoBench / MovieBench: **0.548 / 0.579**, VBench-Long: **0.978**."
tags = ["Autoregressive Video Generation", "KV Cache", "Attention Profiling", "Conditioned Memory Routing", "CHPM"]
resources = [{ kind = "pdf", href = "https://arxiv.org/pdf/2608.28460" }, { kind = "code", href = "https://github.com/Yixuan-Ding-ZJU/LayerRecall" }, { kind = "projectPage", href = "https://yixuan-ding-zju.github.io/LayerRecall_Web/" }, { kind = "demo", href = "https://huggingface.co/spaces/Yixuan-Ding-ZJU/layerrecall-long-video" }, { kind = "details", href = "/publications#layerrecall" }]

